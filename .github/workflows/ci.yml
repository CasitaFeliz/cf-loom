name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks run on the CasitaFeliz org's self-hosted runners (CasitaFeliz/orb-infra, README "CI runners"): an
  # ephemeral microVM per job, like a GitHub-hosted one. If they are down, point runs-on back to ubuntu-latest.
  check:
    runs-on: orb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require a changeset for a change to a package, and a bump that follows the title
        if: github.event_name == 'pull_request' && (github.head_ref != 'changeset-release/main' || github.event.pull_request.head.repo.full_name != github.repository)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pnpm changeset status --since=origin/main --output="$RUNNER_TEMP/changeset-status.json"
          node scripts/check-changeset-bump.ts "$PR_TITLE" "$RUNNER_TEMP/changeset-status.json"
      - name: Install nats-server
        if: runner.arch == 'X64'
        env:
          NATS_SERVER_VERSION: v2.15.1
          NATS_SERVER_SHA256: bf5edc7b1ce98e885c368cb43a886eb148dc5d0551d99f3cf6141fb5e1954c70
        run: |
          archive="nats-server-${NATS_SERVER_VERSION}-linux-amd64"
          curl -fsSL -o "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/nats-io/nats-server/releases/download/${NATS_SERVER_VERSION}/$archive.tar.gz"
          echo "${NATS_SERVER_SHA256}  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
      - name: Install moto
        if: runner.arch == 'X64'
        env:
          UV_VERSION: 0.13.1
          UV_SHA256: eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220
        run: |
          archive="uv-x86_64-unknown-linux-gnu"
          curl -fsSL -o "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/$archive.tar.gz"
          echo "${UV_SHA256}  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$archive/uv" python install --compile-bytecode
          "$RUNNER_TEMP/$archive/uv" venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/$archive/uv" pip install --python "$RUNNER_TEMP/moto/bin/python" --require-hashes --no-build \
            --compile-bytecode -r packages/messaging/test/moto-requirements.txt
          mkdir "$RUNNER_TEMP/moto-bin"
          ln -s "$RUNNER_TEMP/moto/bin/moto_server" "$RUNNER_TEMP/moto-bin/moto_server"
          echo "$RUNNER_TEMP/moto-bin" >> "$GITHUB_PATH"
      - name: Lint the workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - run: pnpm biome ci --error-on-warnings .
      - run: node scripts/check-tsdoc.ts
      - run: node scripts/check-layout.ts
      - run: node scripts/check-terms.ts
      - run: pnpm build
      - run: node scripts/check-expect-errors.ts
      - run: pnpm vitest run --project '!@cf-loom/cli'
  # The CLI reads and publishes through the npm on PATH (packages/cli/ARCHITECTURE.md): its tests run once for each npm
  # release this matrix pins, whose carets are engines.npm of @cf-loom/cli; scripts/npm-releases.test.ts checks that
  # they agree.
  # pnpm puts Node's own folder, with the npm it bundles, first on PATH, so Vitest is started with node.
  cli-npm:
    name: cli-npm (npm ${{ matrix.npm.version }})
    runs-on: orb
    strategy:
      fail-fast: false
      matrix:
        npm:
          - version: 11.13.0
            sha256: PENDING
          - version: 12.2.1
            sha256: PENDING
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install npm ${{ matrix.npm.version }}
        env:
          NPM_VERSION: ${{ matrix.npm.version }}
          NPM_SHA256: ${{ matrix.npm.sha256 }}
        run: |
          archive="npm-${NPM_VERSION}.tgz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://registry.npmjs.org/npm/-/$archive"
          echo "${NPM_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/npm"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/npm"
          mkdir "$RUNNER_TEMP/npm-bin"
          ln -s "$RUNNER_TEMP/npm/package/bin/npm-cli.js" "$RUNNER_TEMP/npm-bin/npm"
          echo "$RUNNER_TEMP/npm-bin" >> "$GITHUB_PATH"
      - name: Check that the npm first on PATH is npm ${{ matrix.npm.version }}
        env:
          NPM_VERSION: ${{ matrix.npm.version }}
        run: |
          found="$(npm -v)"
          test "$found" = "$NPM_VERSION" || { echo "npm on PATH is $found, not $NPM_VERSION" >&2; exit 1; }
      - run: pnpm build
      - run: node node_modules/vitest/vitest.mjs run --project @cf-loom/cli
